<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0B1220" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="HabitFlow" />
  <title>HabitFlow — Update Password</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
  <link rel="alternate icon" href="favicon.svg" />

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Nastaliq+Urdu:wght@500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="stylesheet" href="assets/css/auth.css" />
  <link rel="stylesheet" href="assets/css/developer-modal.css" />
  <script type="module" src="assets/js/theme.js"></script>
  <style>
    .reset-card-wrap {
      width: min(460px, 100%);
      background: var(--surface-primary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 32px 28px;
      box-shadow: var(--shadow-elevated);
    }
  </style>
</head>
<body class="auth-page">
  <div class="reset-card-wrap">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px">
      <a href="habitflow_auth.html" class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#0B1220" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </span>
        <span class="brand-text">HabitFlow</span>
      </a>
      <button type="button" class="btn-secondary" style="padding:4px 10px;font-size:12px;height:32px" data-open-developer-modal>
        Developer
      </button>
    </div>

    <div class="form-head" style="margin-bottom:20px">
      <h2>Set new password</h2>
      <p>Enter a secure new password for your HabitFlow account.</p>
    </div>

    <div id="resetMessage" class="message" role="status" aria-live="polite"></div>

    <form id="resetForm" novalidate>
      <div class="field">
        <div class="label-row"><label for="newPassword">New Password</label></div>
        <div class="input-wrap">
          <input class="password-input" id="newPassword" name="newPassword" type="password" placeholder="At least 8 characters" required minlength="8" autocomplete="new-password" />
          <button class="show-pass" type="button" data-toggle="newPassword" aria-label="Toggle password visibility">
            <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="strength" id="strength"><div class="strength-bar" id="strengthBar"></div></div>
        <div class="strength-label" id="strengthLabel">Use 8+ characters with mixed case, numbers, and symbols.</div>
      </div>

      <div class="field">
        <div class="label-row"><label for="confirmNewPassword">Confirm New Password</label></div>
        <div class="input-wrap">
          <input class="password-input" id="confirmNewPassword" name="confirmNewPassword" type="password" placeholder="Repeat your new password" required minlength="8" autocomplete="new-password" />
          <button class="show-pass" type="button" data-toggle="confirmNewPassword" aria-label="Toggle password visibility">
            <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <button class="btn-primary" type="submit" id="resetSubmitBtn" style="margin-top:10px">
        <span>Save New Password</span>
        <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
      </button>

      <div style="text-align:center;margin-top:20px">
        <a href="habitflow_auth.html" class="text-link" style="font-size:12px;display:inline-flex;align-items:center;gap:4px">
          <svg class="icon icon-sm" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
          <span>Return to Login</span>
        </a>
      </div>
    </form>
  </div>

  <script type="module" src="assets/js/profile.js"></script>
  <script type="module" src="assets/js/reset-password.js"></script>
  <script type="module" src="assets/js/pwa.js"></script>
</body>
</html>
