<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="hfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9be15d" />
      <stop offset="100%" stop-color="#63d6bd" />
    </linearGradient>
    <filter id="hfGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#9be15d" flood-opacity="0.35" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="20" fill="#0b1220" />
  <rect x="6" y="6" width="52" height="52" rx="16" fill="url(#hfGrad)" filter="url(#hfGlow)" />
  <g fill="#102014" transform="translate(32,32)">
    <!-- 8-spoke Asterisk / HabitFlow Starburst mark -->
    <rect x="-3" y="-16" width="6" height="32" rx="3" />
    <rect x="-16" y="-3" width="32" height="6" rx="3" />
    <rect x="-3" y="-16" width="6" height="32" rx="3" transform="rotate(45)" />
    <rect x="-3" y="-16" width="6" height="32" rx="3" transform="rotate(-45)" />
  </g>
</svg>
